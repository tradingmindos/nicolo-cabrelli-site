<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Taxi Pontremoli — caso studio">
  <title>Taxi Pontremoli — caso studio</title>

  <!-- Taxi Pontremoli deep green -->
  <rect width="800" height="450" fill="#1F3D2B"/>

  <!-- inner frame: same gold hairline signature as our OG image -->
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#C4A368" stroke-width="2" stroke-opacity="0.5"/>

  <!-- eyebrow -->
  <text x="56" y="82" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" letter-spacing="6" fill="#C4A368">CASO STUDIO</text>

  <!-- wordmark -->
  <text x="54" y="238" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="52" fill="#F1ECE2">Taxi Pontremoli</text>

  <!-- tagline -->
  <text x="56" y="280" font-family="'Hanken Grotesk', system-ui, sans-serif" font-size="20" fill="#F1ECE2" fill-opacity="0.85">Il tuo taxi in Lunigiana, sempre.</text>

  <!-- url -->
  <text x="56" y="402" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" letter-spacing="1" fill="#C4A368">taxi-pontremoli.com</text>

  <!-- signed gold line, bottom-right, echoing the hero price-line -->
  <path d="M520 408 L560 401 L600 411 L648 397 L690 408 L744 395" fill="none" stroke="#C4A368" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="648" cy="397" r="5" fill="#7C1F2C"/>
</svg>
